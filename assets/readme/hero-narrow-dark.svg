<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 586" width="390" height="586" role="img" aria-label="Animated picture. A Firefox tab strip. Each tab you are not looking at has an idle clock; when it fills, the tab unloads and its icon fades. A tab that is pinned, playing sound, using camera, mic or screen share or on your never-unload list keeps running its clock, but when the clock fills it turns grey and the tab stays loaded. A click on an unloaded tab loads it again, and the tab you left starts a new clock. Default limit 30 minutes, checked every minute.">
<style>@keyframes scene{0%{opacity:0}1.5%{opacity:1}97.5%{opacity:1}99.5%{opacity:0}100%{opacity:0}}
