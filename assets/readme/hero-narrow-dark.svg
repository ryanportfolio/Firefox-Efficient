@keyframes cursor{0%{opacity:0;transform:translate(-8.4px,66.44px)}56%{opacity:0;transform:translate(-8.4px,66.44px)}58%{opacity:1;transform:translate(-8.4px,66.44px)}68%{opacity:1;transform:translate(0px,0px)}90%{opacity:1;transform:translate(0px,0px)}92%{opacity:0;transform:translate(0px,0px)}100%{opacity:0;transform:translate(0px,0px)}}
.cursor{animation:cursor 16s linear infinite}
@keyframes ping{0%{opacity:0;transform:scale(.15)}69%{opacity:0;transform:scale(.15)}70%{opacity:.9;transform:scale(.25)}74%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
